root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/apiserver ./cmd/apiserver"
  bin = "./tmp/apiserver"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "tests"]
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_regex = ["_test\\.go"]

[log]
  time = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"
